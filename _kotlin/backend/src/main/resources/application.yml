spring:
  application:
    name: onyx-foss-kotlin-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  ai:
    vectorstore:
      opensearch:
        uris:
          - ${OPENSEARCH_URL:http://opensearch:9200}
        index-name: ${OPENSEARCH_INDEX:onyx-kotlin-chunks}
        username: ${OPENSEARCH_ADMIN_USERNAME:}
        password: ${OPENSEARCH_ADMIN_PASSWORD:}
        connection-timeout: ${OPENSEARCH_CONNECT_TIMEOUT:30s}
        read-timeout: ${OPENSEARCH_READ_TIMEOUT:60s}
        aws:
          enabled: false
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/onyx}
    username: ${POSTGRES_USER:onyx}
    password: ${POSTGRES_PASSWORD:onyx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${ONYX_MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${ONYX_MAX_UPLOAD_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}

onyx:
  multi-tenant: ${MULTI_TENANT:true}
  crypto:
    key: ${ONYX_CREDENTIAL_ENCRYPTION_KEY:}
  storage:
    root: ${ONYX_FILE_STORAGE_ROOT:/var/lib/onyx/files}
  model-server:
    base-url: ${MODEL_SERVER_URL:http://model-server:9000}
    model-name: ${ONYX_EMBEDDING_MODEL_NAME:}
    embedding-dimension: ${ONYX_EMBEDDING_DIMENSION:768}
    max-context-length: ${ONYX_EMBEDDING_MAX_CONTEXT_LENGTH:512}
    normalize-embeddings: ${ONYX_EMBEDDING_NORMALIZE:true}
    search-candidates: ${ONYX_SEARCH_CANDIDATES:50}
    connect-timeout-ms: ${MODEL_SERVER_CONNECT_TIMEOUT_MS:30000}
    read-timeout-ms: ${MODEL_SERVER_READ_TIMEOUT_MS:600000}
    embed-max-retries: ${ONYX_EMBED_MAX_RETRIES:2}
    embed-retry-initial-backoff-ms: ${ONYX_EMBED_RETRY_INITIAL_BACKOFF_MS:2000}
  scheduler:
    poll-delay-ms: ${ONYX_SCHEDULER_POLL_DELAY_MS:15000}
  worker:
    enabled: ${ONYX_WORKER_ENABLED:false}
    poll-delay-ms: ${ONYX_WORKER_POLL_DELAY_MS:5000}
    heartbeat-interval-ms: ${ONYX_WORKER_HEARTBEAT_INTERVAL_MS:15000}
