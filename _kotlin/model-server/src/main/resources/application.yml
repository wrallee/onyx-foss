spring:
  application:
    name: onyx-foss-kotlin-model-server

server:
  port: ${MODEL_SERVER_PORT:9000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,modelArtifact
        reranker:
          include: rerankerArtifact
  endpoints:
    web:
      exposure:
        include: health

model:
  artifact:
    manifest: ${MODEL_ARTIFACT_MANIFEST:}
  reranker:
    candidate: ${RERANKER_MODEL:Alibaba-NLP/gte-multilingual-reranker-base}
  runtime:
    max-context-length: ${MODEL_RUNTIME_MAX_CONTEXT_LENGTH:512}
    device: ${MODEL_RUNTIME_DEVICE:CPU}
