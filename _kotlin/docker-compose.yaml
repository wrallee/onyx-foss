name: onyx-foss-kotlin

x-backend-environment: &backend-environment
  POSTGRES_URL: jdbc:postgresql://postgres:5432/onyx
  POSTGRES_USER: onyx
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onyx}
  ONYX_CREDENTIAL_ENCRYPTION_KEY: ${ONYX_CREDENTIAL_ENCRYPTION_KEY:?Set a base64-encoded 32-byte key}
  ONYX_FILE_STORAGE_ROOT: /var/lib/onyx/files
  MODEL_SERVER_URL: http://model-server:9000
  ONYX_EMBEDDING_MODEL_NAME: ${ONYX_EMBEDDING_MODEL_NAME:-ibm-granite/granite-embedding-311m-multilingual-r2}
  ONYX_RERANKER_ENABLED: ${ONYX_RERANKER_ENABLED:-true}
  ONYX_RERANKER_MODEL_NAME: ${RERANKER_MODEL:-Alibaba-NLP/gte-multilingual-reranker-base}
  ONYX_RERANKER_MAX_DOCUMENTS: ${RERANKER_MAX_DOCUMENTS:-100}
  OPENSEARCH_URL: https://opensearch:9200
  OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-onyx-kotlin-chunks}
  OPENSEARCH_ADMIN_USERNAME: admin
  OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set a strong OpenSearch admin password}
  OPENSEARCH_VERIFY_CERTS: "false"

services:
  web:
    build:
      context: ./web
    environment:
      API_BASE_URL: http://api:8080
      INTERNAL_URL: http://api:8080
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128

  api:
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      ONYX_WORKER_ENABLED: "false"
    volumes:
      - connector_files:/var/lib/onyx/files
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256

  worker:
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: worker
      ONYX_WORKER_ENABLED: "true"
    volumes:
      - connector_files:/var/lib/onyx/files
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      model-server:
        condition: service_healthy
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256

  model-server:
    build:
      context: ./model-server
    environment:
      EMBEDDING_MODEL_PATH: /models/granite-embedding-311m-multilingual-r2-int8-openvino
      EMBEDDING_MODEL_NAME: ${ONYX_EMBEDDING_MODEL_NAME:-ibm-granite/granite-embedding-311m-multilingual-r2}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-/models/gte-multilingual-reranker-base}
      RERANKER_MODEL: ${RERANKER_MODEL:-Alibaba-NLP/gte-multilingual-reranker-base}
      RERANKER_REQUIRED: "true"
      RERANKER_MAX_DOCUMENTS: ${RERANKER_MAX_DOCUMENTS:-100}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      MODEL_INFERENCE_CONCURRENCY: ${MODEL_INFERENCE_CONCURRENCY:-1}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
    shm_size: 512m
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cpus: 1
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 512

  postgres:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_DB: onyx
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onyx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyx -d onyx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set a strong OpenSearch admin password}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fkSs -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    cpus: 1
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-192.168.240.0/24}

volumes:
  connector_files:
  postgres_data:
  opensearch_data:
